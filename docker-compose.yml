services:
  # Structured Knowledge (Neo4j)
  neo4j:
    image: neo4j:community
    container_name: raredx-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474" # Web Interface (Browser)
      - "${NEO4J_BOLT_PORT:-7687}:7687" # Bolt Protocol (Python Connection)
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password123}
    volumes:
      - ./data/neo4j_data:/data

  # Semantic Memory (ChromaDB)
  chromadb:
    image: chromadb/chroma
    container_name: raredx-chroma
    ports:
      - "${CHROMA_PORT:-8000}:8000"
    volumes:
      - ./data/chroma_data:/data
